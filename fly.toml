# Fly.io configuration for the staging app. The app itself and its secrets
# (CAIRN_DATABASE_URL and others) come from cairn-infra; nothing secret lives here.
# Deploy with: fly deploy --config fly.toml  (prod uses fly.prod.toml once it exists)

app = "cairn-api-staging"
primary_region = "sjc"

[build]

[deploy]
  release_command = "cairn-migrate"

[env]
  CAIRN_ENVIRONMENT = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
